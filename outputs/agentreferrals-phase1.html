<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentReferrals.org — Phase 1 product concept</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--ink:#172b4d;--muted:#71819c;--blue:#2868e8;--pale:#eff5ff;--line:#e8edf5;--bg:#f7f9fc;--green:#148a68;--orange:#c58021}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'DM Sans',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.layout{display:flex;min-height:100vh}.side{width:246px;background:#fff;border-right:1px solid var(--line);padding:24px 16px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:2}.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 32px;font:800 19px Manrope}.mark{height:35px;width:35px;border-radius:12px;color:white;display:grid;place-items:center;background:linear-gradient(145deg,#67b5ff,#2660e9);font-size:19px;box-shadow:0 6px 14px #2868e833}.nav-label{padding:9px 10px;color:#a0abc0;font-size:10px;font-weight:700;letter-spacing:1.2px}.nav{padding:10px 12px;border-radius:10px;display:flex;gap:12px;color:#63728b;margin:2px 0;cursor:pointer;font-weight:600}.nav:hover,.nav.active{background:#edf4ff;color:#2764db}.nav .ico{width:18px;text-align:center;font-size:16px}.pill{margin-left:auto;background:#e2edff;color:#2868e8;border-radius:20px;padding:2px 7px;font-size:11px}.profile{margin-top:auto;border-top:1px solid var(--line);padding:18px 4px 2px;display:flex;align-items:center;gap:10px}.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#dcecff;color:#3267c7;font-weight:700}.profile small{display:block;color:var(--muted);margin-top:3px}.more{margin-left:auto;color:#8090a9}.main{margin-left:246px;width:calc(100% - 246px)}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 36px;justify-content:space-between}.crumb{color:#8b99ae}.crumb b{color:var(--ink);font-weight:600}.top-right{display:flex;align-items:center;gap:18px;color:#687993}.top-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#b9dfff,#d7cbff);display:grid;place-items:center;color:#4f61a6;font-weight:700}.content{max-width:1420px;margin:auto;padding:34px 38px 58px}.welcome{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.welcome h1{font:800 25px Manrope;margin:0 0 6px;letter-spacing:-.6px}.welcome p{margin:0;color:var(--muted)}.btn{border:1px solid var(--line);background:white;color:#415470;border-radius:9px;padding:10px 15px;font-weight:700}.btn.primary{color:#fff;border:0;background:linear-gradient(110deg,#43a5f5,#3267e8);box-shadow:0 5px 12px #2868e82b}.btn:hover{filter:brightness(.98);transform:translateY(-1px)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:23px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:19px;box-shadow:0 2px 8px #1a355508}.stat-head{display:flex;justify-content:space-between;color:#75839a;font-weight:600;font-size:12px}.stat-icon{width:32px;height:32px;border-radius:9px;background:#edf4ff;color:#2868e8;display:grid;place-items:center;font-size:16px}.stat-num{font:800 27px Manrope;margin:14px 0 5px}.stat-foot{font-size:11px;color:#8b98aa}.up{color:var(--green);font-weight:700}.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(270px,.8fr);gap:18px}.panel{background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:19px 21px;border-bottom:1px solid var(--line)}.panel-head h2{font:700 15px Manrope;margin:0}.link{color:var(--blue);font-weight:700;cursor:pointer}.filters{padding:14px 18px;display:flex;gap:9px;border-bottom:1px solid var(--line)}.search{flex:1;min-width:120px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);outline-color:#9fc2ff}.filter{border:1px solid var(--line);border-radius:8px;background:white;padding:8px 10px;color:#65758c}.listing{padding:17px 20px;border-bottom:1px solid #edf0f5}.listing:last-child{border:0}.list-top{display:flex;justify-content:space-between;align-items:flex-start}.listing h3{font-size:14px;margin:0 0 6px}.loc{color:#8190a5;font-size:12px}.tag{padding:5px 9px;border-radius:20px;background:#edf5ff;color:#3970ce;font-weight:700;font-size:10px;white-space:nowrap}.meta{display:flex;gap:17px;color:#71819a;font-size:11px;margin-top:15px}.meta strong{color:#31425b}.mini-avatar{display:inline-grid;width:22px;height:22px;border-radius:50%;background:#e5ecf8;place-items:center;font-size:9px;color:#4468a9;vertical-align:middle;margin-right:6px}.activity{padding:4px 20px}.event{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #eff1f5}.event:last-child{border:0}.dot{width:31px;height:31px;border-radius:10px;background:#eef4ff;display:grid;place-items:center;color:#3170e2;flex:none}.event b{font-size:12px}.event p{color:#7b899e;font-size:11px;margin:5px 0}.event time{color:#a2adbd;font-size:10px}.status{padding:4px 8px;border-radius:16px;background:#e9f8f2;color:#158061;font-size:10px;font-weight:700}.status.review{background:#fff4e6;color:#bc7719}.steps{display:flex;align-items:center;gap:5px;padding:19px 20px}.step{flex:1;text-align:center;font-size:10px;color:#8290a5}.step i{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;margin:0 auto 7px;background:#edf2f9;color:#73829b;font-style:normal;font-weight:bold}.step.done i{background:#dff5ed;color:#148a68}.step.current i{background:linear-gradient(135deg,#52aafa,#3a66e2);color:white}.step-line{height:2px;background:#e4eaf2;width:20px;margin-top:-15px}.hidden{display:none!important}.page-title{font:800 24px Manrope;margin:2px 0 6px}.page-desc{color:var(--muted);margin:0 0 23px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:14px 16px;border-bottom:1px solid #edf0f5;font-size:12px}.table th{color:#8794a8;font-size:10px;letter-spacing:.4px}.empty{text-align:center;padding:40px;color:var(--muted)}.modal-bg{position:fixed;inset:0;background:#172b4d77;z-index:5;display:grid;place-items:center;padding:20px}.modal{background:white;border-radius:15px;width:min(500px,100%);padding:25px;box-shadow:0 20px 70px #10234544}.modal h2{font:800 20px Manrope;margin:0 0 8px}.modal p{color:var(--muted)}.modal label{display:block;font-size:12px;font-weight:700;margin:14px 0 6px}.modal input,.modal select{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.toast{position:fixed;right:24px;bottom:24px;background:#142e53;color:white;padding:13px 18px;border-radius:10px;z-index:8;box-shadow:0 8px 25px #112b4c33}.badge{color:#2468de;background:#edf4ff;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:700}.adminbox{padding:22px;background:linear-gradient(120deg,#f0f6ff,#fff);border:1px solid #dce8fc;border-radius:13px;margin-bottom:18px}.adminbox h3{margin:0 0 7px;font:700 16px Manrope}.adminbox p{color:var(--muted);margin:0;line-height:1.6}
@media(max-width:1050px){.side{width:210px}.main{margin-left:210px;width:calc(100% - 210px)}.content{padding:27px 22px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top{padding:0 22px}}@media(max-width:650px){.side{width:60px;padding:18px 8px}.brand{padding:0 4px 28px}.brand-name,.nav-label,.nav span:not(.ico),.profile div:not(.avatar),.more{display:none}.nav{justify-content:center;padding:11px 4px}.nav .ico{font-size:19px}.main{margin-left:60px;width:calc(100% - 60px)}.content{padding:22px 14px}.top{padding:0 15px}.stats{gap:9px}.card{padding:14px}.stat-num{font-size:22px}.welcome{align-items:flex-start;gap:10px}.welcome h1{font-size:20px}.welcome .btn{font-size:11px;padding:9px}.filters{flex-wrap:wrap}.search{flex-basis:100%}.filter{flex:1}.meta{gap:9px;flex-wrap:wrap}.table th,.table td{padding:11px 9px;font-size:10px}.hide-mobile{display:none}}
</style></head><body><div class="layout"><aside class="side"><div class="brand"><div class="mark">↗</div><span class="brand-name">Agent<span style="color:#3278e8">Referrals</span><small style="font-size:12px;color:#71819c">.org</small></span></div><div class="nav-label">WORKSPACE</div><div class="nav active" data-page="overview"><span class="ico">▦</span><span>Overview</span></div><div class="nav" data-page="marketplace"><span class="ico">⌕</span><span>Marketplace</span></div><div class="nav" data-page="myreferrals"><span class="ico">⇧</span><span>My referrals</span><span class="pill">4</span></div><div class="nav" data-page="applications"><span class="ico">▤</span><span>Applications</span><span class="pill">3</span></div><div class="nav" data-page="pipeline"><span class="ico">⇢</span><span>Deal pipeline</span></div><div class="nav-label" style="margin-top:17px">ACCOUNT</div><div class="nav" data-page="profile"><span class="ico">◎</span><span>My profile</span></div><div class="nav" data-page="admin"><span class="ico">⚙</span><span>Admin overview</span></div><div class="profile"><div class="avatar">JP</div><div><b>Jordan Parker</b><small>Real estate professional</small></div><span class="more">•••</span></div></aside><main class="main"><header class="top"><div class="crumb">Workspace&nbsp; / &nbsp;<b id="crumb">Overview</b></div><div class="top-right"><span>❔ <span class="hide-mobile">Help</span></span><span style="font-size:18px">♧</span><div class="top-avatar">JP</div></div></header><section class="content" id="app"></section></main></div><div id="modal-root"></div><script>
const data=[{title:'Luxury condo buyer referral',loc:'Austin, TX · Residential',fee:'25%',value:'$825k',days:2,agent:'Michael Chen',initial:'MC',tag:'Buyer lead'},{title:'Commercial office sale opportunity',loc:'Denver, CO · Commercial',fee:'20%',value:'$1.2M',days:5,agent:'Sarah Mitchell',initial:'SM',tag:'Commercial'},{title:'Relocation buyer — move-in ready',loc:'Nashville, TN · Residential',fee:'25%',value:'$540k',days:1,agent:'Alex Rivera',initial:'AR',tag:'Buyer lead'},{title:'Multi-family investment property',loc:'Phoenix, AZ · Investment',fee:'30%',value:'$2.4M',days:4,agent:'Taylor Brooks',initial:'TB',tag:'Investment'}];let current='overview';const app=document.querySelector('#app');
function card(x){return `<article class="listing searchable"><div class="list-top"><div><h3>${x.title}</h3><div class="loc">⌖ &nbsp;${x.loc}</div></div><span class="tag">${x.tag}</span></div><div class="meta"><span>Referral fee <strong>${x.fee}</strong></span><span>Est. value <strong>${x.value}</strong></span><span><i class="mini-avatar">${x.initial}</i>${x.agent}</span><span>${x.days}d ago</span><button class="btn apply" style="margin-left:auto;padding:6px 10px;font-size:11px">View details</button></div></article>`}
function listingPanel(){return `<div class="panel"><div class="panel-head"><h2>Fresh opportunities</h2><span class="link" data-go="marketplace">Explore marketplace&nbsp; →</span></div><div class="filters"><input class="search" id="search" placeholder="⌕  Search referrals, locations…"><select class="filter" id="category"><option>All categories</option><option>Residential</option><option>Commercial</option><option>Investment</option></select><select class="filter"><option>Any fee</option><option>20%+</option></select></div><div id="listings">${data.slice(0,3).map(card).join('')}</div></div>`}
function activities(){return `<div class="panel"><div class="panel-head"><h2>Recent activity</h2><span class="link">View all</span></div><div class="activity"><div class="event"><div class="dot">✓</div><div><b>New application received</b><p>Emily Carter applied to your Seattle referral.</p><time>12 minutes ago</time></div></div><div class="event"><div class="dot">↗</div><div><b>Referral published</b><p>Your Austin buyer lead is now live.</p><time>2 hours ago</time></div></div><div class="event"><div class="dot">◎</div><div><b>Profile verified</b><p>Your professional profile is verified.</p><time>Yesterday</time></div></div></div></div>`}
function dashboard(){return `<div class="welcome"><div><h1>Good morning, Jordan <span style="font-size:21px">👋</span></h1><p>Here’s what’s happening with your referrals today.</p></div><button class="btn primary" id="post">＋ &nbsp;Post a referral</button></div><div class="stats">${[['Active referrals','—','Sample layout','↗'],['Applications received','—','Sample layout','▤'],['In progress','—','Sample layout','⇢'],['Closed this month','—','Sample layout','✓']].map(([a,b,c,d])=>`<div class="card"><div class="stat-head">${a}<span class="stat-icon">${d}</span></div><div class="stat-num">${b}</div><div class="stat-foot"><span class="up">${c.includes('↑')?c.split(' ')[0]+' '+c.split(' ')[1]:''}</span> ${c.replace(/^↑ \d+ /,'')}</div></div>`).join('')}</div><div class="grid"><div>${listingPanel()}</div><div style="display:grid;align-content:start;gap:18px">${activities()}<div class="panel"><div class="panel-head"><h2>Referral journey</h2><span class="badge">12 active</span></div><div class="steps"><div class="step done"><i>✓</i>Posted</div><div class="step-line"></div><div class="step done"><i>✓</i>Applied</div><div class="step-line"></div><div class="step current"><i>3</i>Matched</div><div class="step-line"></div><div class="step"><i>4</i>Closed</div></div></div></div></div>`}
function simplePage(page){const configs={marketplace:['Marketplace','Find the right local professional for your next opportunity.'],myreferrals:['My referrals','Track and manage the opportunities you have shared.'],applications:['Applications','Review professionals interested in your opportunities.'],pipeline:['Deal pipeline','Follow every active referral from match to close.'],profile:['Professional profile','Your public profile and verification details.'],admin:['Admin overview','A clear view of platform operations and member verification.']};const [title,desc]=configs[page];let rows=page==='applications'?[['Luxury condo buyer referral','Emily Carter','Austin, TX','Today','Pending'],['Office sale opportunity','David Wilson','Denver, CO','Yesterday','Reviewing'],['Relocation buyer lead','Priya Shah','Nashville, TN','Sep 22','Pending']]:[['Luxury condo buyer referral','Austin, TX','Residential','$825k','Active'],['Office sale opportunity','Denver, CO','Commercial','$1.2M','In progress'],['Relocation buyer lead','Nashville, TN','Residential','$540k','Active']];if(page==='admin')return `<div class="welcome"><div><h1 class="page-title">${title}</h1><p class="page-desc">${desc}</p></div><span class="badge">Super admin</span></div><div class="adminbox"><h3>Platform operations</h3><p>Review pending professional verification, moderate marketplace listings, and keep member activity healthy. Admin access is restricted to authorized platform staff.</p></div><div class="stats">${[['Pending verification','14','Needs review','◎'],['Active professionals','248','+18 this month','♙'],['Live referrals','86','Across 23 cities','↗'],['Flagged content','2','Requires attention','⚑']].map(([a,b,c,d])=>`<div class="card"><div class="stat-head">${a}<span class="stat-icon">${d}</span></div><div class="stat-num">${b}</div><div class="stat-foot">${c}</div></div>`).join('')}</div><div class="panel"><div class="panel-head"><h2>Verification queue</h2><span class="link">Manage queue →</span></div><table class="table"><thead><tr><th>PROFESSIONAL</th><th>LICENSE</th><th>SUBMITTED</th><th>STATUS</th></tr></thead><tbody><tr><td>Olivia Bennett</td><td>TX · 098321</td><td>Today</td><td><span class="status review">Needs review</span></td></tr><tr><td>Noah Williams</td><td>CO · FA.100091</td><td>Yesterday</td><td><span class="status review">Needs review</span></td></tr><tr><td>Ava Thompson</td><td>TN · 361204</td><td>Sep 23</td><td><span class="status">Verified</span></td></tr></tbody></table></div>`;
return `<div class="welcome"><div><h1 class="page-title">${title}</h1><p class="page-desc">${desc}</p></div><button class="btn primary" id="post">＋ &nbsp;Post a referral</button></div><div class="stats">${[['Total referrals','12','All time','↗'],['Active','8','Currently open','◎'],['In progress','3','Matched and moving','⇢'],['Completed','1','Successfully closed','✓']].map(([a,b,c,d])=>`<div class="card"><div class="stat-head">${a}<span class="stat-icon">${d}</span></div><div class="stat-num">${b}</div><div class="stat-foot">${c}</div></div>`).join('')}</div><div class="panel"><div class="panel-head"><h2>${page==='applications'?'Recent applications':'Your opportunities'}</h2><span class="badge">${rows.length} shown</span></div><div class="filters"><input class="search" id="search" placeholder="⌕  Search by name or location…"><select class="filter"><option>All statuses</option><option>Active</option><option>In progress</option></select></div><table class="table"><thead><tr>${(page==='applications'?['REFERRAL','APPLICANT','LOCATION','APPLIED','STATUS']:['REFERRAL','LOCATION','TYPE','EST. VALUE','STATUS']).map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr>${r.slice(0,-1).map(x=>`<td>${x}</td>`).join('')}<td><span class="status ${i===1?'review':''}">${r.at(-1)}</span></td></tr>`).join('')}</tbody></table></div>`}
function render(page){current=page;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));document.querySelector('#crumb').textContent=({overview:'Overview',marketplace:'Marketplace',myreferrals:'My referrals',applications:'Applications',pipeline:'Deal pipeline',profile:'My profile',admin:'Admin overview'})[page];app.innerHTML=page==='overview'?dashboard():simplePage(page);bind()}
function bind(){document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>render(x.dataset.go));const s=document.querySelector('#search');if(s)s.oninput=()=>{const q=s.value.toLowerCase();document.querySelectorAll('.searchable').forEach(el=>el.style.display=el.textContent.toLowerCase().includes(q)?'':'none')};const c=document.querySelector('#category');if(c)c.onchange=()=>document.querySelectorAll('.searchable').forEach(el=>el.style.display=(c.value==='All categories'||el.textContent.toLowerCase().includes(c.value.toLowerCase()))?'':'none');const p=document.querySelector('#post');if(p)p.onclick=postModal;document.querySelectorAll('.apply').forEach(b=>b.onclick=()=>toast('Referral details opened — applications are part of Phase 4.'))}
function postModal(){document.querySelector('#modal-root').innerHTML=`<div class="modal-bg" id="bg"><div class="modal"><h2>Post a referral</h2><p>Share an opportunity with trusted professionals in the network.</p><label>Referral title</label><input placeholder="e.g. Relocation buyer in Austin"><label>Location</label><input placeholder="City, State"><label>Referral category</label><select><option>Residential</option><option>Commercial</option><option>Investment</option></select><label>Referral fee</label><select><option>25%</option><option>20%</option><option>30%</option></select><div class="modal-actions"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="save">Save draft</button></div></div></div>`;document.querySelector('#cancel').onclick=()=>document.querySelector('#modal-root').innerHTML='';document.querySelector('#bg').onclick=e=>{if(e.target.id==='bg')document.querySelector('#modal-root').innerHTML=''};document.querySelector('#save').onclick=()=>{document.querySelector('#modal-root').innerHTML='';toast('Draft saved in this preview. Firebase connection is planned for Phase 2.')}}function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),3000)}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>render(n.dataset.page));render('overview');
</script></body></html>
